# Checks every push and pull request: lint, types, unit tests, migration safety and a full production build
# against a fresh Postgres (the same steps Railway's build runs, without touching the live database).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: urko_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/urko_ci
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      # production build without S3 storage / email (only allowed outside Railway)
      LOCAL_PRODUCTION_TEST: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the migration check compares with the base commit

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Throwaway secrets for this run
        run: |
          for name in PAYLOAD_SECRET AUTH_SECRET; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - run: npm ci

      - name: Migrations only add things
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: node scripts/ci/check-migrations.mjs

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Payload migrations on an empty database
        run: npx payload migrate
        env:
          NODE_ENV: production

      # two stores, their teams and a shopper against the real database: nobody reaches another store's records
      - name: Tenant isolation
        run: npm run test:tenants

      # trials ending, grace periods, expiry – the default store is never taken offline
      - name: Plan lifecycle
        run: npm run test:billing

      # part of an order first, the rest later; never more than ordered; another store can't ship it
      - name: Partial shipments
        run: npm run test:shipments

      # stores outside Pakistan: currency and time zone from the country, cents kept, own payment methods, postcode zones
      - name: Stores in other countries
        run: npm run test:international

      # checkout's transaction, status messages queued once, stock and coupon given back exactly once on cancel
      - name: Order lifecycle
        run: npm run test:orders

      # store-connected payment gateways with the providers simulated: paid only from the provider, wrong amounts never
      # paid, forged updates refused, abandoned pages cancelled, refunds
      - name: Store payment gateways
        run: npm run test:integration-payments

      # security events recorded, one marketplace sync at a time, courier cash → order paid, platform history and alerts
      - name: Merchant webhooks (local receiver)
        run: npm run test:store-webhooks

      - name: Platform operations
        run: npm run test:platform-ops

      - name: Gift cards
        run: npm run test:gift-cards

      - name: Pre-orders and backorders
        run: npm run test:preorders

      - name: Unsubscribe from reminders
        run: npm run test:unsubscribe

      - name: Stock value report
        run: npm run test:stock-value

      - name: Loyalty points
        run: npm run test:loyalty

      - name: Shop funnel
        run: npm run test:shop-funnel

      - name: Version history for a store's team
        run: npm run test:versions

      - name: Digital products
        run: npm run test:digital

      - name: Account security (password reset, account ids)
        run: npm run test:account-security

      - name: Payment integrity (payment after cancelling, one refund ledger)
        run: npm run test:payment-integrity

      - name: Courier tracking selection
        run: npm run test:courier-sync

      - name: Shop counter payments (change, cash lines)
        run: npm run test:pos-payments

      # a product with a photo for the browser test (before the build and the server, which cache the catalog)
      - name: Test product
        run: npm run test:e2e:seed

      # 10 shoppers buying the last 2 at the same moment: exactly 2 sold, never below 0
      - name: Stock under concurrent orders
        run: npm run test:stock

      # known security advisories in dependencies, reported in the log (not failing the build: the ones open today are
      # inside Payload's and Next's own dependencies – audit-reports/13, DEP-1)
      - name: Dependency advisories
        run: npm audit --omit=dev --audit-level=critical || true

      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production

      # the money path in a real headless Chrome (GitHub's runners have Google Chrome): product → cart → checkout →
      # order placed → thank-you page, on a desktop and a phone screen – against the production build
      - name: Browser checkout
        env:
          NODE_ENV: production
        run: |
          npx next start -p 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health > /dev/null && break; sleep 2; done
          E2E_BASE_URL=http://localhost:3000 npm run test:e2e || (tail -n 80 server.log; exit 1)
          # the same server: anonymous access to every collection, private files and admin endpoints is refused
          npm run test:security -- http://localhost:3000 || (tail -n 80 server.log; exit 1)

      # the backup service's image builds, and a dump made exactly like its nightly one restores into an empty database
      # with every table and row (docs/BACKUP-RESTORE.md, "Option B")
      - name: Backup and restore drill
        run: |
          docker build -q -f scripts/backup/Dockerfile -t shop-backup .
          docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" shop-backup sh -c 'pg_dump --no-owner --no-privileges --clean --if-exists --format=plain "$DATABASE_URL" | gzip -9' > backup.sql.gz
          gzip -t backup.sql.gz
          docker run --rm --network host shop-backup psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE restore_drill"
          gunzip -c backup.sql.gz | docker run --rm -i --network host shop-backup psql "postgresql://postgres:postgres@localhost:5432/restore_drill" -v ON_ERROR_STOP=1 -q > /dev/null
          node scripts/tests/compare-restore.mjs "$DATABASE_URL" "postgresql://postgres:postgres@localhost:5432/restore_drill"
